services:
  - type: web
    name: codingmasters
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server_db.py
    healthCheckPath: /healthz
    envVars:
      - key: FIREBASE_DB_URL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
